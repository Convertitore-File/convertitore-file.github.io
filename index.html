<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="RKO1aZ0JBWYuCCtH508wotMkRLjNaPTsXx0LdjliGCs"/>
    <link rel="icon" type="image/jpeg" href="Logo.jpeg">
    <link rel="stylesheet" href="style.css">

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- SEO Base -->
    <title>Convertitore di file in PDF</title>
    <meta name="description" content="Convertitore gratuito di file in PDF">
    <meta name="keywords" content="Convertitore, convertitore gratis, convertitore PDF">
    <link rel="canonical" href="https://convertitore-file.github.io/">

    <!-- Open Graph -->
    <meta property="og:title" content="Convertire file in PDF">
    <meta property="og:description" content="Convertire facilmente i propri file in formato PDF">
</head>
<body>
    <div class="toolbar">
        <h2>Generatore PDF Documentazione C#</h2>
        <p style="font-size: 14px; color: #475569;">Seleziona il file <strong>documentazione.xml</strong> dalla cartella del tuo progetto</p>
        <label class="btn">
            📂 Scegli file XML
            <input type="file" id="xmlFileInput" accept=".xml">
        </label>
        <button class="btn btn-print" id="printBtn" onclick="window.print()">🖨️ Salva come PDF</button>
    </div>

    <div id="output"></div>

    <script src="script.js"></script>
</body>
</html>
